services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_TIMEOUT_SECONDS: 300
      OLLAMA_API_TEMPERATURE: "0"
      OLLAMA_API_NUM_PREDICT: "200"
      OLLAMA_CHAT_TEMPERATURE: "0.7"
      OLLAMA_CHAT_NUM_PREDICT: "400"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
